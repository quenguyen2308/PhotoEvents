<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Outer Glow & Shadow -->
    <filter id="iconShadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#FF6584" flood-opacity="0.38"/>
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#2E1A29" flood-opacity="0.25"/>
    </filter>

    <!-- Base Gradient -->
    <linearGradient id="baseGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8FA3"/>
      <stop offset="45%" stop-color="#FF6584"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Bevel Rim Gradient -->
    <linearGradient id="rimGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#5B21B6" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Lens Glass Reflection -->
    <linearGradient id="lensRing1" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#F3E8FF" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#C084FC" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.8"/>
    </linearGradient>

    <radialGradient id="lensCore1" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFE8EE"/>
      <stop offset="30%" stop-color="#FF6584"/>
      <stop offset="75%" stop-color="#3B0764"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </radialGradient>

    <!-- Aperture Reflections -->
    <linearGradient id="apertureGlow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Golden Star Gradient -->
    <linearGradient id="goldStar1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="30%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Top Gloss Crescent Highlight -->
    <linearGradient id="glossHighlight1" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="85%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Bottom Rim Glow -->
    <linearGradient id="bottomGlow1" x1="50%" y1="100%" x2="50%" y2="40%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Main Circular Icon with Drop Shadow -->
  <g filter="url(#iconShadow1)">
    <!-- Base Circle -->
    <circle cx="256" cy="256" r="224" fill="url(#baseGrad1)"/>

    <!-- Outer Rim Stroke for 3D Bevel Edge -->
    <circle cx="256" cy="256" r="222" fill="none" stroke="url(#rimGrad1)" stroke-width="4"/>

    <!-- Bottom Inner Rim Light -->
    <circle cx="256" cy="256" r="220" fill="url(#bottomGlow1)"/>

    <!-- Stylized Camera Body Elements (Soft Translucent 3D) -->
    <!-- Camera Top Bar / Flash Island -->
    <rect x="180" y="96" width="152" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.25"/>
    <circle cx="304" cy="108" r="5" fill="#FEF08A" fill-opacity="0.9"/>

    <!-- Camera Outer Body Plate -->
    <rect x="100" y="140" width="312" height="240" rx="64" fill="#FFFFFF" fill-opacity="0.16" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>

    <!-- Big Lens Outer Metal/Glass Bezel -->
    <circle cx="256" cy="265" r="105" fill="#180A24" fill-opacity="0.45"/>
    <circle cx="256" cy="265" r="98" fill="none" stroke="url(#lensRing1)" stroke-width="14"/>

    <!-- Lens Glass Deep Core -->
    <circle cx="256" cy="265" r="88" fill="url(#lensCore1)"/>

    <!-- Aperture Blades Iris Accent -->
    <circle cx="256" cy="265" r="62" fill="none" stroke="url(#apertureGlow1)" stroke-width="8" stroke-dasharray="25 6"/>
    <circle cx="256" cy="265" r="45" fill="#2E1A29" fill-opacity="0.8"/>
    
    <!-- Lens Specular Reflection Spots -->
    <ellipse cx="230" cy="235" rx="28" ry="16" transform="rotate(-30 230 235)" fill="#FFFFFF" fill-opacity="0.7"/>
    <circle cx="278" cy="292" r="8" fill="#FFFFFF" fill-opacity="0.4"/>
    <circle cx="286" cy="242" r="4" fill="#38BDF8" fill-opacity="0.8"/>

    <!-- Star Favorite Badge (Floating 3D Golden Star at Top Right) -->
    <g transform="translate(330, 130)">
      <!-- Star Shadow -->
      <circle cx="24" cy="24" r="32" fill="#F59E0B" fill-opacity="0.3"/>
      <!-- Star Shape -->
      <polygon points="24,2 31,16 46,18 35,29 38,44 24,36 10,44 13,29 2,18 17,16" 
               fill="url(#goldStar1)" stroke="#FFFFFF" stroke-width="2"/>
      <!-- Star Sparkle Highlight -->
      <polygon points="24,8 28,17 38,18 30,25 33,35 24,29 15,35 18,25 10,18 20,17" 
               fill="#FEF08A" fill-opacity="0.6"/>
      <circle cx="20" cy="16" r="3" fill="#FFFFFF"/>
    </g>

    <!-- Little Sparkle Star on Left -->
    <path d="M 125 190 Q 135 190 135 180 Q 135 190 145 190 Q 135 190 135 200 Q 135 190 125 190 Z" fill="#FFFFFF" fill-opacity="0.9"/>
    <circle cx="135" cy="190" r="1.5" fill="#FEF08A"/>

    <!-- Super Glossy Dome Crescent Overlay (Signature Glossy Icon Effect) -->
    <path d="M 52,190 C 80,100 160,42 256,42 C 352,42 432,100 460,190 C 390,140 310,120 256,120 C 202,120 122,140 52,190 Z" 
          fill="url(#glossHighlight1)"/>

    <!-- Secondary Gloss Edge Arc -->
    <ellipse cx="256" cy="72" rx="140" ry="24" fill="#FFFFFF" fill-opacity="0.35"/>
  </g>
</svg>
