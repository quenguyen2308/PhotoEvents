<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Outer Glow & Shadow -->
    <filter id="iconShadow5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#8B5CF6" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#3B0764" flood-opacity="0.3"/>
    </filter>

    <radialGradient id="sphereBase" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FF9BB0"/>
      <stop offset="35%" stop-color="#FF6584"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#311042"/>
    </radialGradient>

    <!-- Glass Rim Highlight -->
    <linearGradient id="glassRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Film Ribbon Gradient -->
    <linearGradient id="filmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#FFE4E6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F3E8FF" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Specular Highlight Top-Left -->
    <radialGradient id="specularGlint" cx="28%" cy="24%" r="28%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Caustic Bottom Light -->
    <radialGradient id="causticGlow" cx="50%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#A855F7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Main Circle -->
  <g filter="url(#iconShadow5)">
    <!-- Sphere Base with 3D Depth -->
    <circle cx="256" cy="256" r="224" fill="url(#sphereBase)"/>

    <!-- Bottom Caustic Glow (Light bouncing off table through sphere) -->
    <circle cx="256" cy="256" r="224" fill="url(#causticGlow)"/>

    <!-- Inner Bokeh Bubbles -->
    <circle cx="160" cy="340" r="32" fill="#FFFFFF" fill-opacity="0.18"/>
    <circle cx="340" cy="320" r="24" fill="#FFFFFF" fill-opacity="0.14"/>
    <circle cx="370" cy="180" r="16" fill="#FDE047" fill-opacity="0.35"/>
    <circle cx="140" cy="170" r="20" fill="#38BDF8" fill-opacity="0.25"/>

    <!-- Curving 3D Film Strip / Timeline Stream Ribbon -->
    <g transform="translate(256, 260)">
      <!-- Ribbon Shadow -->
      <path d="M -140 50 C -80 -90, 80 -100, 140 10 C 100 80, -20 70, -70 20 Z" 
            fill="#1E1B4B" fill-opacity="0.35"/>
      <!-- Main Translucent Ribbon -->
      <path d="M -140 40 C -80 -100, 80 -110, 140 0 C 100 70, -20 60, -70 10 Z" 
            fill="url(#filmGrad)" stroke="#FFFFFF" stroke-width="2"/>
      <!-- Film Sprocket Holes & Photo Frames -->
      <rect x="-85" y="-50" width="36" height="26" rx="4" fill="#FF6584" fill-opacity="0.75" transform="rotate(-25 -85 -50)"/>
      <rect x="-20" y="-72" width="38" height="28" rx="4" fill="#8B5CF6" fill-opacity="0.75" transform="rotate(-6 -20 -72)"/>
      <rect x="50" y="-60" width="36" height="26" rx="4" fill="#06B6D4" fill-opacity="0.75" transform="rotate(18 50 -60)"/>
      
      <!-- Sprocket dots along edge -->
      <circle cx="-100" cy="-28" r="2.5" fill="#2E1A29" fill-opacity="0.4"/>
      <circle cx="-50" cy="-62" r="2.5" fill="#2E1A29" fill-opacity="0.4"/>
      <circle cx="15" cy="-68" r="2.5" fill="#2E1A29" fill-opacity="0.4"/>
      <circle cx="80" cy="-44" r="2.5" fill="#2E1A29" fill-opacity="0.4"/>
    </g>

    <!-- Central Glowing Star (The Featured Event Star) -->
    <g transform="translate(256, 220)">
      <polygon points="0,-36 10,-12 36,-3 17,16 20,41 0,27 -20,41 -17,16 -36,-3 -10,-12" 
               fill="#F59E0B" stroke="#FFFFFF" stroke-width="2.5"/>
      <polygon points="0,-24 7,-8 24,-2 11,10 13,27 0,18 -13,27 -11,10 -24,-2 -7,-8" 
               fill="#FEF08A" fill-opacity="0.8"/>
      <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
    </g>

    <!-- Star Twinkles -->
    <path d="M 330 140 Q 340 140 340 130 Q 340 140 350 140 Q 340 140 340 150 Q 340 140 330 140 Z" fill="#FFFFFF"/>
    <path d="M 160 210 Q 168 210 168 202 Q 168 210 176 210 Q 168 210 168 218 Q 168 210 160 210 Z" fill="#FEF08A"/>

    <!-- 3D Glass Sphere Specular Highlights -->
    <!-- Primary Hotspot Light Glint (Top Left) -->
    <ellipse cx="180" cy="140" rx="90" ry="50" transform="rotate(-30 180 140)" fill="url(#specularGlint)"/>

    <!-- Sharp White Reflection Arc (Top Edge) -->
    <path d="M 80,180 C 100,105 170,55 256,52 C 340,55 410,105 432,180 C 370,125 310,105 256,105 C 200,105 140,125 80,180 Z" 
          fill="#FFFFFF" fill-opacity="0.55"/>

    <!-- Outer 3D Glass Rim Bevel -->
    <circle cx="256" cy="256" r="222" fill="none" stroke="url(#glassRim)" stroke-width="4.5"/>
  </g>
</svg>
