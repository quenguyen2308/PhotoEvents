<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Outer Glow & Shadow -->
    <filter id="c4_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0284C7" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E1B4B" flood-opacity="0.3"/>
    </filter>

    <filter id="c4_card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.35"/>
    </filter>

    <!-- Base Gradient -->
    <linearGradient id="c4_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6584"/>
      <stop offset="45%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Scenery -->
    <linearGradient id="c4_scenery" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="40%" stop-color="#FB923C"/>
      <stop offset="80%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Gloss -->
    <linearGradient id="c4_gloss" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="80%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g filter="url(#c4_shadow)">
    <!-- Base Circle -->
    <circle cx="256" cy="256" r="224" fill="url(#c4_bg)"/>
    <circle cx="256" cy="256" r="222" fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="4.5"/>

    <!-- HERO COMPOSITION: Calendar (Events) on Top-Left overlapping with Photo Frame (Photos) on Bottom-Right -->
    
    <!-- 1. The Calendar (Events Component) at Top-Left -->
    <g transform="translate(195, 205)" filter="url(#c4_card)">
      <!-- Calendar Body -->
      <rect x="-105" y="-105" width="210" height="200" rx="26" fill="#FFFFFF"/>
      <!-- Red Header with rings -->
      <path d="M -105,-75 C -105,-92 -92,-105 -75,-105 L 75,-105 C 92,-105 105,-92 105,-75 L 105,-50 L -105,-50 Z" fill="#EF4444"/>
      <!-- Rings -->
      <rect x="-65" y="-115" width="16" height="24" rx="8" fill="#CBD5E1" stroke="#94A3B8" stroke-width="2"/>
      <rect x="49" y="-115" width="16" height="24" rx="8" fill="#CBD5E1" stroke="#94A3B8" stroke-width="2"/>
      <!-- Date Label -->
      <text x="0" y="-65" font-family="sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">EVENT</text>
      <!-- Calendar Grid Matrix -->
      <circle cx="-60" cy="-20" r="8" fill="#E2E8F0"/>
      <circle cx="-20" cy="-20" r="8" fill="#E2E8F0"/>
      <circle cx="20" cy="-20" r="8" fill="#E2E8F0"/>
      <circle cx="60" cy="-20" r="8" fill="#E2E8F0"/>
      
      <circle cx="-60" cy="15" r="8" fill="#E2E8F0"/>
      <circle cx="-20" cy="15" r="8" fill="#E2E8F0"/>
      <!-- The Event Day (Marked with bright pink circle) -->
      <circle cx="20" cy="15" r="14" fill="#FF4772"/>
      <text x="20" y="20" font-family="sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">18</text>
      
      <circle cx="60" cy="15" r="8" fill="#E2E8F0"/>

      <circle cx="-60" cy="50" r="8" fill="#E2E8F0"/>
      <circle cx="-20" cy="50" r="8" fill="#E2E8F0"/>
      <circle cx="20" cy="50" r="8" fill="#E2E8F0"/>
      <circle cx="60" cy="50" r="8" fill="#E2E8F0"/>
    </g>

    <!-- 2. The Photo Card (Photos Component) at Bottom-Right, Overlapping 3D -->
    <g transform="translate(305, 305) rotate(8)" filter="url(#c4_card)">
      <!-- Polaroid Base -->
      <rect x="-105" y="-105" width="210" height="225" rx="22" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="3"/>
      <!-- Scenery inside photo -->
      <rect x="-90" y="-90" width="180" height="150" rx="14" fill="url(#c4_scenery)"/>
      <circle cx="45" cy="-35" r="22" fill="#FEF08A"/>
      <path d="M -90 35 L -40 -15 L 15 25 L 55 -5 L 90 35 L 90 60 L -90 60 Z" fill="#1E1B4B" fill-opacity="0.85"/>
      <!-- Bottom Caption Bar -->
      <rect x="-70" y="78" width="140" height="14" rx="7" fill="#E2E8F0"/>
      <!-- Glass reflection -->
      <path d="M -90 -90 L 10 -90 L -60 60 L -90 60 Z" fill="#FFFFFF" fill-opacity="0.25"/>
    </g>

    <!-- 3. The Golden Star of "Featured Photo" uniting Calendar & Photo -->
    <g transform="translate(245, 235)">
      <circle cx="0" cy="0" r="32" fill="#F59E0B" fill-opacity="0.35"/>
      <polygon points="0,-28 8,-10 28,-2 13,12 16,31 0,21 -16,31 -13,12 -28,-2 -8,-10" 
               fill="#F59E0B" stroke="#FFFFFF" stroke-width="3"/>
      <polygon points="0,-18 5,-6 18,-1 8,7 10,20 0,13 -10,20 -8,7 -18,-1 -5,-6" 
               fill="#FEF08A"/>
      <circle cx="0" cy="0" r="3.5" fill="#FFFFFF"/>
    </g>

    <!-- Glossy Dome Crescent Highlight -->
    <path d="M 52,190 C 80,100 160,42 256,42 C 352,42 432,100 460,190 C 390,140 310,120 256,120 C 202,120 122,140 52,190 Z" 
          fill="url(#c4_gloss)"/>
    <ellipse cx="256" cy="72" rx="140" ry="24" fill="#FFFFFF" fill-opacity="0.4"/>
  </g>
</svg>
