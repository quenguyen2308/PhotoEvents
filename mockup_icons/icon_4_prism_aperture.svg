<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Outer Glow & Shadow -->
    <filter id="iconShadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#EC4899" flood-opacity="0.38"/>
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1E1B4B" flood-opacity="0.25"/>
    </filter>

    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#FDE047" flood-opacity="0.8"/>
    </filter>

    <!-- Base Gradient -->
    <radialGradient id="baseGrad4" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="60%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>

    <!-- Outer Rim -->
    <linearGradient id="rimGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB3C1"/>
      <stop offset="40%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <!-- Gloss Sheen -->
    <linearGradient id="glossGrad4" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="80%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Blade Gradients -->
    <linearGradient id="b1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6584"/><stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>
    <linearGradient id="b2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/><stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="b3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/><stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="b4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/><stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="b5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/><stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="b6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/><stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
  </defs>

  <!-- Main Circle -->
  <g filter="url(#iconShadow4)">
    <circle cx="256" cy="256" r="224" fill="url(#baseGrad4)"/>
    <circle cx="256" cy="256" r="222" fill="none" stroke="url(#rimGrad4)" stroke-width="6"/>

    <!-- Timeline Event Dots and Ticks around ring -->
    <circle cx="256" cy="256" r="202" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="4 16"/>
    <!-- Event Milestone Gems -->
    <circle cx="256" cy="54" r="5" fill="#FF8FA3"/>
    <circle cx="458" cy="256" r="5" fill="#A855F7"/>
    <circle cx="256" cy="458" r="5" fill="#38BDF8"/>
    <circle cx="54" cy="256" r="5" fill="#FBBF24"/>

    <!-- Glass Outer Ring -->
    <circle cx="256" cy="256" r="172" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2"/>

    <!-- 6-Blade Aperture Iris (Geometric Flower / Shutter) -->
    <g transform="translate(256, 256)">
      <!-- Blade 1 -->
      <path d="M 0,-155 C 60,-155 120,-110 135,-45 L 35,-20 Z" fill="url(#b1)" fill-opacity="0.9"/>
      <!-- Blade 2 -->
      <path d="M 0,-155 C 60,-155 120,-110 135,-45 L 35,-20 Z" fill="url(#b2)" fill-opacity="0.9" transform="rotate(60)"/>
      <!-- Blade 3 -->
      <path d="M 0,-155 C 60,-155 120,-110 135,-45 L 35,-20 Z" fill="url(#b3)" fill-opacity="0.9" transform="rotate(120)"/>
      <!-- Blade 4 -->
      <path d="M 0,-155 C 60,-155 120,-110 135,-45 L 35,-20 Z" fill="url(#b4)" fill-opacity="0.9" transform="rotate(180)"/>
      <!-- Blade 5 -->
      <path d="M 0,-155 C 60,-155 120,-110 135,-45 L 35,-20 Z" fill="url(#b5)" fill-opacity="0.9" transform="rotate(240)"/>
      <!-- Blade 6 -->
      <path d="M 0,-155 C 60,-155 120,-110 135,-45 L 35,-20 Z" fill="url(#b6)" fill-opacity="0.9" transform="rotate(300)"/>

      <!-- Center Aperture Core Glass -->
      <circle cx="0" cy="0" r="50" fill="#180A24" fill-opacity="0.8" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="3"/>

      <!-- Radiant Center Star (Gold Star of Featured Photo) -->
      <g filter="url(#starGlow)">
        <polygon points="0,-32 9,-10 32,-1 15,14 18,36 0,24 -18,36 -15,14 -32,-1 -9,-10" 
                 fill="#FDE047" stroke="#FFFFFF" stroke-width="2"/>
        <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
      </g>
    </g>

    <!-- Camera Body Silhouette / Top Corner Notch -->
    <rect x="220" y="80" width="72" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.3"/>

    <!-- High Gloss Dome Crescent -->
    <path d="M 52,190 C 80,100 160,42 256,42 C 352,42 432,100 460,190 C 390,140 310,120 256,120 C 202,120 122,140 52,190 Z" 
          fill="url(#glossGrad4)"/>
    <ellipse cx="256" cy="72" rx="140" ry="24" fill="#FFFFFF" fill-opacity="0.4"/>
  </g>
</svg>
