<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Outer Glow & Shadow -->
    <filter id="c5_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#8B5CF6" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E1B4B" flood-opacity="0.3"/>
    </filter>

    <filter id="c5_card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.35"/>
    </filter>

    <!-- Base Gradient -->
    <linearGradient id="c5_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7597"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Photos Colors -->
    <linearGradient id="c5_p1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>

    <linearGradient id="c5_p2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="c5_p3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="c5_gloss" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="80%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g filter="url(#c5_shadow)">
    <!-- Base Circle -->
    <circle cx="256" cy="256" r="224" fill="url(#c5_bg)"/>
    <circle cx="256" cy="256" r="222" fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="4.5"/>

    <!-- STACK OF 3 PHOTOS (Representing Multiple Photos per Event & Reordering) -->
    
    <!-- Photo 3 (Back left) -->
    <g transform="translate(180, 260) rotate(-16)" filter="url(#c5_card)">
      <rect x="-95" y="-115" width="190" height="230" rx="20" fill="#FFFFFF" opacity="0.85"/>
      <rect x="-80" y="-100" width="160" height="150" rx="12" fill="url(#c5_p3)"/>
      <circle cx="35" cy="-55" r="16" fill="#FEF08A"/>
    </g>

    <!-- Photo 2 (Back right) -->
    <g transform="translate(325, 265) rotate(14)" filter="url(#c5_card)">
      <rect x="-95" y="-115" width="190" height="230" rx="20" fill="#FFFFFF" opacity="0.9"/>
      <rect x="-80" y="-100" width="160" height="150" rx="12" fill="url(#c5_p2)"/>
      <circle cx="-40" cy="-60" r="18" fill="#FEF08A"/>
    </g>

    <!-- Photo 1 (Front & Center: The Featured Representative Photo with Event Badge) -->
    <g transform="translate(256, 275)" filter="url(#c5_card)">
      <rect x="-105" y="-120" width="210" height="240" rx="22" fill="#FFFFFF"/>
      
      <!-- Photo Scenery -->
      <rect x="-90" y="-105" width="180" height="150" rx="14" fill="url(#c5_p1)"/>
      <circle cx="45" cy="-45" r="24" fill="#FEF08A"/>
      <path d="M -90 25 L -45 -20 L 10 20 L 50 -10 L 90 25 L 90 45 L -90 45 Z" fill="#4C0519" fill-opacity="0.8"/>
      
      <!-- Event Date Badge on the Photo itself -->
      <g transform="translate(-40, 75)">
        <rect x="-45" y="-16" width="90" height="32" rx="10" fill="#FFE4E6"/>
        <text x="0" y="5" font-family="sans-serif" font-size="14" font-weight="900" fill="#E11D48" text-anchor="middle">OCT 24</text>
      </g>

      <!-- Glass Sheen -->
      <path d="M -90 -105 L 15 -105 L -65 45 L -90 45 Z" fill="#FFFFFF" fill-opacity="0.25"/>
    </g>

    <!-- The Golden Star Emblem (Pinned on the Top Representative Photo) -->
    <g transform="translate(340, 135)">
      <circle cx="28" cy="28" r="36" fill="#F59E0B" fill-opacity="0.4"/>
      <polygon points="28,2 36,18 54,21 41,34 44,52 28,43 12,52 15,34 2,21 20,18" 
               fill="#F59E0B" stroke="#FFFFFF" stroke-width="3"/>
      <polygon points="28,9 33,20 44,22 36,31 38,42 28,36 18,42 20,31 12,22 23,20" 
               fill="#FEF08A" fill-opacity="0.8"/>
      <circle cx="23" cy="18" r="3.5" fill="#FFFFFF"/>
    </g>

    <!-- Google Drive Cloud Sync Icon (Top-Left Badge) -->
    <g transform="translate(100, 140)">
      <circle cx="26" cy="26" r="32" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2.5"/>
      <path d="M 16 34 A 12 12 0 0 1 36 20 A 10 10 0 0 1 44 32 Z" fill="#0EA5E9" fill-opacity="0.2"/>
      <!-- Cloud arrows -->
      <path d="M 16 26 A 10 10 0 0 1 36 26" fill="none" stroke="#0284C7" stroke-width="3.5" stroke-linecap="round"/>
      <polygon points="34,21 40,26 35,30" fill="#0284C7"/>
    </g>

    <!-- Glossy Dome Crescent Highlight -->
    <path d="M 52,190 C 80,100 160,42 256,42 C 352,42 432,100 460,190 C 390,140 310,120 256,120 C 202,120 122,140 52,190 Z" 
          fill="url(#c5_gloss)"/>
    <ellipse cx="256" cy="72" rx="140" ry="24" fill="#FFFFFF" fill-opacity="0.4"/>
  </g>
</svg>
